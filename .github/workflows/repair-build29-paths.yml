name: Repair Build 29 source paths

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-build29-paths.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Build 29 modules into correct folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/core src/desktop

          core_files=(
            music-theory.js
            notations.js
            playback.js
            score-model.js
            selection.js
            solfa-layout.js
            solfa-parser.js
            solfa.js
            workspace-state.js
          )

          desktop_files=(
            file-service.js
            shutdown-controller.js
          )

          for file in "${core_files[@]}"; do
            test -f "$file"
            cp "$file" "src/core/$file"
            rm "$file"
          done

          for file in "${desktop_files[@]}"; do
            test -f "$file"
            cp "$file" "src/desktop/$file"
            rm "$file"
          done

          git rm --ignore-unmatch .github/workflows/repair-build29-paths.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core src/desktop
          git commit -m "Place Build 29 modules in correct source folders"
          git push origin HEAD:main
